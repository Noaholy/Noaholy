{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 animate-on-load">
            <div class="card-header bg-transparent">
                <h4 class="mb-0 fw-bold">
                    <i class="bi {% if action == 'IN' %}bi-box-arrow-in-down{% else %}bi-box-arrow-up{% endif %} text-primary me-2"></i>
                    {{ 'Add Stock In' if action == 'IN' else 'Record Stock Out' }} - {{ item.name }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-sort-numeric-up-alt me-2"></i>Quantity
                        </label>
                        <input type="number" name="quantity" class="form-control form-control-lg" 
                               min="1" required placeholder="Enter quantity">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-chat-text me-2"></i>Notes (optional)
                        </label>
                        <textarea name="notes" class="form-control" rows="4" 
                                  placeholder="Add any remarks..."></textarea>
                    </div>
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                            <i class="bi bi-check-circle me-2"></i>Submit
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary flex-grow-1 py-3">
                            <i class="bi bi-arrow-left me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
