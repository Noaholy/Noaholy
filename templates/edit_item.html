{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 animate-on-load">
            <div class="card-header bg-transparent">
                <h4 class="mb-0 fw-bold">
                    <i class="bi bi-pencil-square text-primary me-2"></i>
                    Edit Prices - {{ item.name }}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label">
                                <i class="bi bi-cash-stack me-2 text-success"></i>Buying Price (RWF)
                            </label>
                            <input type="number" step="0.01" name="buying_price" 
                                   class="form-control form-control-lg" 
                                   value="{{ item.unit_buying_price }}" min="0" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">
                                <i class="bi bi-cash me-2 text-primary"></i>Selling Price (RWF)
                            </label>
                            <input type="number" step="0.01" name="selling_price" 
                                   class="form-control form-control-lg" 
                                   value="{{ item.unit_selling_price }}" min="0" required>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-5">
                        <button type="submit" class="btn btn-primary flex-grow-1 py-3">
                            <i class="bi bi-check-lg me-2"></i>Update Prices
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary flex-grow-1 py-3">
                            <i class="bi bi-x-lg me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
